name: Build and native checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    name: Validate (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: standalone
            integrations: ''
          - profile: styles
            integrations: styles
          - profile: engineered
            integrations: engineered
          - profile: combined
            integrations: styles,engineered
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Verify generated recipe discovery and item guidance
        if: matrix.profile == 'standalone'
        run: |
          python3 scripts/generate-teaching-data.py
          python3 scripts/generate-ponder.py
          git diff --exit-code -- src/main/resources src/main/java/dev/fourthdimension/client/ponder/PonderLessons.java
      - name: Verify recorded GUI and save observations
        if: matrix.profile == 'standalone'
        run: |
          python3 scripts/verify-integrated-acceptance.py \
            docs/evidence/0.3/integrated-schema3-before.json \
            docs/evidence/0.3/integrated-schema4-saved.json \
            docs/evidence/0.3/integrated-schema4-reopened.json
          python3 scripts/verify-appearance-lifecycle.py
          python3 scripts/verify-styled-ride.py
          python3 scripts/verify-banked-styled-ride.py
          python3 scripts/verify-scheduler-checkpoint.py
      - run: ./gradlew clean build runGameTestServer --no-daemon "-PfdIntegrations=$FD_INTEGRATIONS"
        env:
          FD_INTEGRATIONS: ${{ matrix.integrations }}
      - name: Audit installed Arrow decoration on native bank frames
        if: matrix.profile == 'styles' || matrix.profile == 'combined'
        run: |
          FD_STYLE_JARS=("$HOME"/.gradle/caches/modules-2/files-2.1/curse.maven/coasters-simulated-track-styles-1642719/9020601/*/*.jar)
          test "${#FD_STYLE_JARS[@]}" -eq 1
          python3 scripts/audit-arrow-style-geometry.py "${FD_STYLE_JARS[0]}" \
            build/runs/gametest/bank-native-frames.json > build/banked-clearance.json
          FD_BASE_JARS=("$HOME"/.gradle/caches/modules-2/files-2.1/curse.maven/create-coasters-simulated-1601871/8655742/*/*.jar)
          test "${#FD_BASE_JARS[@]}" -eq 1
          python3 scripts/audit-arrow-wheel-clearance.py "${FD_BASE_JARS[0]}" \
            "${FD_STYLE_JARS[0]}" > build/wheel-clearance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-evidence-${{ matrix.profile }}
          path: |
            build/libs/*.jar
            build/reports/tests/**
            build/test-results/**
            build/runs/gametest/logs/**
            build/runs/gametest/bank-native-frames.json
            build/banked-clearance.json
            build/wheel-clearance.json
