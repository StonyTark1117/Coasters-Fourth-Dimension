plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'dev.fourthdimension'
base { archivesName = 'coasters-fourth-dimension' }
// Java classpaths use ':' as a separator on Unix. Keep compiled outputs outside a
// colon-containing checkout (such as the project's human-readable title).
if (projectDir.absolutePath.contains(':') && File.pathSeparator == ':') {
    layout.buildDirectory = file("${System.getProperty('java.io.tmpdir')}/fourthdimension-${Integer.toHexString(projectDir.absolutePath.hashCode())}/build")
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
if (project.hasProperty('fdPackaged')) {
    sourceSets { packaged }
    configurations.packagedImplementation.extendsFrom(configurations.implementation)
    configurations.packagedRuntimeOnly.extendsFrom(configurations.runtimeOnly)
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven {
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroup 'dev.ryanhcode.sable'; includeGroup 'dev.ryanhcode.sable-companion' }
    }
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
}

neoForge {
    version = neo_version
    if (project.hasProperty('fdPackaged')) addModdingDependenciesTo sourceSets.packaged
    runs {
        client {
            client(); gameDirectory = layout.buildDirectory.dir(project.hasProperty('fdPackaged') ? 'runs/packaged-client' : 'runs/client').get().asFile
            if (project.hasProperty('fdConnect')) programArguments.addAll '--quickPlayMultiplayer', project.property('fdConnect')
            if (project.hasProperty('fdWorld')) programArguments.addAll '--quickPlaySingleplayer', project.property('fdWorld')
            systemProperty 'fourthdimension.validation', project.hasProperty('fdValidation').toString()
            systemProperty 'fourthdimension.renderValidation', project.hasProperty('fdRenderValidation').toString()
            systemProperty 'fourthdimension.renderValidationExit', project.hasProperty('fdRenderValidationExit').toString()
            systemProperty 'fourthdimension.renderValidationStages', project.findProperty('fdRenderValidationStages') ?: '500'
            systemProperty 'fourthdimension.carrierValidation', project.hasProperty('fdCarrierValidation').toString()
            systemProperty 'fourthdimension.carrierValidationExit', project.hasProperty('fdCarrierValidationExit').toString()
            systemProperty 'fourthdimension.carrierValidationSamples', project.findProperty('fdCarrierValidationSamples') ?: '40'
            systemProperty 'fourthdimension.carrierValidationTimeout', project.findProperty('fdCarrierValidationTimeout') ?: '600'
            systemProperty 'fourthdimension.carrierValidationFamilies', project.findProperty('fdCarrierValidationFamilies') ?: '1'
            systemProperty 'fourthdimension.carrierValidationMotion', project.hasProperty('fdCarrierValidationMotion').toString()
            systemProperty 'fourthdimension.carrierValidationMotionFamilies', project.findProperty('fdCarrierValidationMotionFamilies') ?: '1'
            systemProperty 'fourthdimension.carrierValidationMotionPaxChassis', project.findProperty('fdCarrierValidationMotionPaxChassis') ?: '0'
            systemProperty 'fourthdimension.carrierValidationRender', project.hasProperty('fdCarrierValidationRender').toString()
            systemProperty 'fourthdimension.carrierFixture', project.hasProperty('fdCarrierFixture').toString()
            systemProperty 'fourthdimension.carrierFixtureMotion', project.hasProperty('fdCarrierFixtureMotion').toString()
            systemProperty 'fourthdimension.carrierFixtureRider', project.hasProperty('fdCarrierFixtureRider').toString()
            systemProperty 'fourthdimension.carrierFixtureRiderOnly', project.hasProperty('fdCarrierFixtureRiderOnly').toString()
            systemProperty 'fourthdimension.carrierFixtureRiderFamily', project.findProperty('fdCarrierFixtureRiderFamily') ?: 'ARROW'
            systemProperty 'fourthdimension.carrierFixtureSupportLoss', project.hasProperty('fdCarrierFixtureSupportLoss').toString()
            systemProperty 'fourthdimension.carrierFixtureSupportLossMotion', project.hasProperty('fdCarrierFixtureSupportLossMotion').toString()
            systemProperty 'fourthdimension.carrierFixtureSupportRepair', project.hasProperty('fdCarrierFixtureSupportRepair').toString()
            systemProperty 'fourthdimension.carrierValidationRider', project.hasProperty('fdCarrierValidationRider').toString()
            systemProperty 'fourthdimension.carrierValidationSupportLoss', project.hasProperty('fdCarrierValidationSupportLoss').toString()
            systemProperty 'fourthdimension.carrierValidationSupportLossMotion', project.hasProperty('fdCarrierValidationSupportLossMotion').toString()
            systemProperty 'fourthdimension.carrierValidationSupportRepair', project.hasProperty('fdCarrierValidationSupportRepair').toString()
            systemProperty 'fourthdimension.carrierValidationSupportLossFamily', project.findProperty('fdCarrierValidationSupportLossFamily') ?: 'ARROW'
            systemProperty 'fourthdimension.ponderValidation', project.hasProperty('fdPonderValidation').toString()
            systemProperty 'fourthdimension.schedulerValidation', project.hasProperty('fdSchedulerValidation').toString()
            systemProperty 'fourthdimension.fontValidation', project.hasProperty('fdFontValidation').toString()
            systemProperty 'fourthdimension.fontValidationReloads', project.hasProperty('fdFontValidationReload') ? '1' : (project.findProperty('fdFontValidationReloads') ?: '0')
            systemProperty 'fourthdimension.fontValidationChat', project.hasProperty('fdFontValidationChat').toString()
            systemProperty 'fourthdimension.fontValidationExit', project.hasProperty('fdFontValidationExit').toString()
        }
        observer {
            client(); gameDirectory = layout.buildDirectory.dir(project.hasProperty('fdPackaged') ? 'runs/packaged-observer' : 'runs/observer').get().asFile
            programArguments.addAll '--username', 'Observer'
            if (project.hasProperty('fdConnect')) programArguments.addAll '--quickPlayMultiplayer', project.property('fdConnect')
            systemProperty 'fourthdimension.validation', project.hasProperty('fdValidation').toString()
        }
        server {
            server(); gameDirectory = layout.buildDirectory.dir(project.hasProperty('fdPackaged') ? 'runs/packaged-server' : 'runs/server').get().asFile; programArgument '--nogui'
            systemProperty 'fourthdimension.freezeOnStart', project.hasProperty('fdFrozen').toString()
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('runs/gametest').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'fourthdimension'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            systemProperty 'fourthdimension.validation', project.hasProperty('fdValidation').toString()
            systemProperty 'fourthdimension.shuttleValidation', project.hasProperty('fdShuttleValidation').toString()
            systemProperty 'fourthdimension.performanceTargetValidation', project.hasProperty('fdPerformanceTargets').toString()
            if (project.hasProperty('fdPackaged')) {
                sourceSet = sourceSets.packaged
                loadedMods = []
            }
        }
    }
    if (!project.hasProperty('fdPackaged')) mods { fourthdimension { sourceSet(sourceSets.main) } }
}

// Optional addons are development profiles only; the distributed addon never bundles them.
def fdIntegrationProfiles = (findProperty('fdIntegrations') ?: '').toString().split(',').findAll { !it.isBlank() }.toSet()
def fdUnknownProfiles = fdIntegrationProfiles - ['styles', 'engineered']
if (!fdUnknownProfiles.isEmpty()) throw new GradleException("Unknown fdIntegrations profiles: ${fdUnknownProfiles}")

dependencies {
    if (fdIntegrationProfiles.contains('styles')) runtimeOnly 'curse.maven:coasters-simulated-track-styles-1642719:9020601'
    if (fdIntegrationProfiles.contains('engineered')) runtimeOnly 'curse.maven:coasters-engineered-1643631:8863559'
    if (project.hasProperty('fdPackaged')) packagedRuntimeOnly files(layout.buildDirectory.file("libs/coasters-fourth-dimension-${mod_version}.jar"))
    implementation('com.simibubi.create:create-1.21.1:6.0.10-280:slim') { transitive = false }
    implementation 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    runtimeOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
    implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    implementation 'dev.ryanhcode.sable:sable-neoforge-1.21.1:2.0.3'
    implementation 'curse.maven:create-coasters-simulated-1601871:8655742'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    // Standalone math tests do not inherit the Minecraft runtime libraries.
    testImplementation 'org.joml:joml:1.10.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
configurations.configureEach {
    resolutionStrategy.force 'com.simibubi.create:create-1.21.1:6.0.10-280'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('test') { useJUnitPlatform() }
tasks.named('jar') {
    from('LICENSE') { into 'META-INF'; rename { 'LICENSE-fourthdimension.txt' } }
}
tasks.named('runGameTestServer') {
    doFirst {
        delete layout.buildDirectory.dir('runs/gametest/world')
        delete layout.buildDirectory.file('runs/gametest/bank-native-frames.json')
        delete layout.buildDirectory.file('runs/gametest/recovery-bank-native-frames.json')
        delete layout.buildDirectory.file('runs/gametest/recovery-bank-train-native-frames.json')
        delete layout.buildDirectory.file('runs/gametest/recovery-bank-mesh-trace.jsonl')
        delete layout.buildDirectory.file('runs/gametest/recovery-bank-train-mesh-trace.jsonl')
    }
}
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
